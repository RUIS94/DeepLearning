name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DeepLearning.slnx

      - name: Build
        run: dotnet build DeepLearning.slnx --no-restore --configuration Release

      # Testcontainers needs a Docker daemon, which GitHub-hosted Ubuntu
      # runners already provide — no separate service container needed.
      # Excludes [Trait("Category","LlmIntegration")] tests: those make a real
      # Claude API call (cost + needs a live key in secrets, which CI doesn't
      # have configured) and belong in a nightly job per the design doc's own
      # test strategy, not on every push/PR.
      - name: Test
        run: dotnet test DeepLearning.slnx --no-build --configuration Release --filter "Category!=LlmIntegration" --logger "console;verbosity=normal"
